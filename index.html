<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Tasks | ToDo Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#26364a;font-family:system-ui,sans-serif}main{max-width:850px;margin:60px auto;padding:20px}h1{font-size:38px;margin-bottom:4px}.sub{color:#64748b}.panel{background:white;border-radius:18px;padding:25px;box-shadow:0 12px 35px #24324a13;margin:24px 0}form{display:grid;grid-template-columns:1fr 150px 135px auto;gap:9px}input,select,button{font:inherit;padding:12px;border:1px solid #d5deea;border-radius:9px;min-width:0}button{cursor:pointer;background:#355ed4;color:white;border:0}button.secondary{background:#e8eef9;color:#334765}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters button.active{background:#355ed4;color:white}.filters button{background:#e8eef9;color:#334765}.task{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #edf0f5}.task:last-child{border:0}.task .details{flex:1;min-width:0}.task.done .details{text-decoration:line-through;color:#8b98a9}.meta{font-size:12px;color:#748196}.task button{padding:8px 11px}.empty{text-align:center;color:#748196;padding:28px}footer{font-size:12px;color:#748196}@media(max-width:650px){main{margin:18px auto}form{grid-template-columns:1fr 1fr}form input:first-child{grid-column:1/-1}.task{flex-wrap:wrap}.task .details{flex-basis:65%}}</style></head><body><main><h1>Focus Tasks</h1><p class="sub">やることを整理して、今日を前に進める。</p><div class="panel"><h2>タスクを追加</h2><form id="add"><input id="title" required maxlength="100" placeholder="タスク名"><input id="due" type="date"><select id="priority"><option value="高">優先度：高</option><option value="中" selected>優先度：中</option><option value="低">優先度：低</option></select><button>追加</button></form></div><div class="panel"><h2>タスク一覧 <span id="count" class="sub"></span></h2><div class="filters"><button class="active" data-filter="all">すべて</button><button data-filter="open">未完了</button><button data-filter="done">完了</button><button data-filter="high">優先度：高</button></div><div id="tasks" aria-live="polite"></div></div><footer>この作品はブラウザ保存（localStorage）を利用したフロントエンドデモです。Laravel・MySQL・ログイン機能は未実装です。</footer></main><script>const key='focus-tasks-demo-v1';let items;try{items=JSON.parse(localStorage.getItem(key))||[]}catch{items=[]}let filter='all';const save=()=>localStorage.setItem(key,JSON.stringify(items));function render(){const root=document.getElementById('tasks');root.replaceChildren();const shown=items.filter(t=>filter==='all'||filter==='open'&&!t.done||filter==='done'&&t.done||filter==='high'&&t.priority==='高');document.getElementById('count').textContent=`(${items.filter(t=>!t.done).length} 件未完了)`;if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent='表示するタスクがありません';root.append(p)}shown.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','完了切り替え');cb.onchange=()=>{t.done=cb.checked;save();render()};const detail=document.createElement('div');detail.className='details';const title=document.createElement('strong');title.textContent=t.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=`優先度：${t.priority}　${t.due?'期限：'+t.due:'期限なし'}`;detail.append(title,meta);const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{const v=prompt('タスク名を編集',t.title);if(v!==null&&v.trim()){t.title=v.trim().slice(0,100);save();render()}};const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>{if(confirm('このタスクを削除しますか？')){items=items.filter(x=>x.id!==t.id);save();render()}};row.append(cb,detail,edit,del);root.append(row)})}document.getElementById('add').onsubmit=e=>{e.preventDefault();items.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title:document.getElementById('title').value.trim(),due:document.getElementById('due').value,priority:document.getElementById('priority').value,done:false});save();e.target.reset();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script></body></html>
